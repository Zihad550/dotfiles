force_keyboard_focus = true                                                 # forces keyboard forcus to stay in Walker
selection_wrap = true                                                       # wrap list if at bottom or top
theme = "default"                                                   # theme to use
additional_theme_location = "~/.config/walker/themes/"

[placeholders]
"default" = { input = " Search...", list = "No Results" } # placeholders for input and empty list, key is the providers name, so f.e. "desktopapplications" or "menus:other"

# [keybinds]
# quick_activate = []


[providers]
default = [
  "desktopapplications",
  "menus:system",
  "menus:media",
  "menus:other",
  "menus:display",
  # "menus:dotfilesDirs",
  # "menus:dotfilesThemes",
  # "menus:dotfilesBackgrounds",
  "websearch",
  "calc",
  "windows"
] # providers to be queried by default. Heavy menus read from cache files; lua refreshes them in background when stale.

[providers.actions]
"menus:dotfilesDirs" = [
  { action = "menus:default", default = true, bind = "Return", label = "open in zed (ssh)", after = "Close" },
  { action = "menus:open", bind = "shift Return", label = "open with...", after = "Nothing" },
  { action = "menus:parent", bind = "Escape", after = "Nothing" },
]
"menus:dotfilesFiles" = [
  { action = "menus:default", default = true, bind = "Return", label = "open in zed (ssh)", after = "Close" },
  { action = "menus:open", bind = "shift Return", label = "open with...", after = "Nothing" },
  { action = "menus:parent", bind = "Escape", after = "Nothing" },
]
"menus:dotfilesThemes" = [
  { action = "menus:default", default = true, bind = "Return", label = "apply theme", after = "Close" },
]
"menus:dotfilesBackgrounds" = [
  { action = "menus:default", default = true, bind = "Return", label = "set background", after = "Close" },
]
"menus:dotfilesScreenshots" = [
  { action = "menus:default", default = true, bind = "Return", label = "copy image", after = "Close" },
  { action = "copy_path", bind = "shift Return", label = "copy path(s)", after = "Close" },
  { action = "mark", bind = "Tab", label = "mark/unmark", after = "AsyncReload" },
]

[[providers.prefixes]]
prefix = "?"
provider = "providerlist"

# Walker merges these over its shipped defaults (resources/config.toml) by
# matching on PROVIDER, not prefix:
#     if let Some(p_a) = self.prefixes.iter_mut()
#         .find(|item| item.provider == p.provider) { p_a.prefix = p.prefix }
#     else { self.prefixes.push(p) }
# so a block can only ever retarget a known provider or add a new one -- a
# default prefix cannot be deleted. Walker ships "/" -> files, so claiming "/"
# for our menu merely appends a second "/" entry and the built-in files provider
# (open action hardcoded to xdg-open) keeps winning. Moving files to its own
# prefix is what actually frees "/".
#
# Keep this block even though elephant.toml now sets ignored_providers=["files"]:
# that stops the provider loading, but walker's default "/" -> files mapping is
# static and would still claim "/". With files ignored, "," simply returns
# nothing.
# [[providers.prefixes]]
# prefix = ","
# provider = "menus:dotfilesFiles"

# Return -> zed, shift Return -> pick the app, so "/dotfiles" lands on
# ~/dotfiles and opens it in Zed.
[[providers.prefixes]]
prefix = "/"
provider = "menus:dotfilesDirs"

# "~folder-name": matching folders, each followed by its contents. Empty query
# lists nothing on purpose -- see menus/dotfiles_files.lua. "~" is unused by
# walker's defaults, and menus:dotfilesFiles is a new provider name, so this
# appends rather than colliding.
[[providers.prefixes]]
prefix = "~"
provider = "menus:dotfilesFiles"

[[providers.prefixes]]
prefix = "."
provider = "symbols"

[[providers.prefixes]]
prefix = "="
provider = "calc"

[[providers.prefixes]]
prefix = "@"
provider = "websearch"

[[providers.prefixes]]
prefix = "$"
provider = "clipboard"
