$mainMod = SUPER # Sets "Windows" key as main modifier

# applicate state
# bind = $mainMod, Q, killactive,
bindd = $mainMod, W, Close window, killactive,

# hyprland
bindd = $mainMod ALT, M, Exit hyprland, exit,

# layout
bindd = $mainMod SHIFT, V, Toggle floating, togglefloating
bindd = $mainMod ALT, P, Pseudo, pseudo # dwindle
bindd = $mainMod, slash, Toggle split, togglesplit # dwindle

# power settings
binddl = $mainMod ALT CTRL, S, Shutdown, exec, shutdown now
binddl = $mainMod ALT SHIFT, R, Restart, exec, shutdown -r now
binddl = $mainMod SHIFT, R, reload hyprlan, exec, hyprctl reload
binddl = $mainMod ALT SHIFT, S, Suspend, exec, systemctl suspend
binddl = $mainMod ALT SHIFT, l, Lock, exec, hyprlock

# luncher
bindd = $mainMod, space, walker, exec, uwsm-app -- walker
# bind = $mainMod, space, exec, hyprlauncher
# bind = $mainMod SHIFT, space, exec, rofi -modi "window,ssh" -show combi
# rofi -show drun -run-command "uwsm app -- {cmd}"
# rofi -modi "drun,ssh,window,combi" -show combi -run-command "uwsm app -- {cmd}"
bindd = $mainMod SHIFT, space, Window, exec, uwsm-app -- rofi -show window
bindd = $mainMod, P, Processes, exec, uwsm-app -- rofi -show manage_processes
bindd = $mainMod SHIFT, P, Scripts, exec, uwsm-app -- rofi -show multi_script

# utility gui applications
bindd = $mainMod ALT, 1, Brave, exec, uwsm-app -- brave --new-window --ozone-platform=wayland
bindd = $mainMod ALT, 2, Perplexity, exec, $webapp="https://www.perplexity.ai"
bindd = $mainMod ALT, 3, Gemini, exec, $webapp="https://gemini.google.com/app"
bindd = $mainMod ALT, 4, MongoDB Compass, exec, flatpak run com.mongodb.Compass --trustedConnectionString $(pass env/mongodb_uri)

# custom scripts
# bind = $mainMod ALT, S, exec, bash -c 'if pgrep -f nerd-dictation >/dev/null; then nerd-dictation end; else nerd-dictation begin --simulate-input-tool WTYPE --idle-time 0 >/dev/null 2>&1 & fi'

# special gui applications
bind = $mainMod, Return, exec, $terminal
# bindd = $mainMod, B, Zen Browser Dev, exec, ~/dotfiles/bin/hyprland-launch-zen "zendev" "uwsm-app -- flatpak run app.zen_browser.zen -P dev"
bindd = $mainMod ALT, B, Zen Browser 008, exec, ~/dotfiles/bin/hyprland-launch-zen "zen008" "uwsm-app -- flatpak run app.zen_browser.zen -P 008"

bindd = $mainMod, B, Zen Browser dev, exec, uwsm-app -- flatpak run app.zen_browser.zen -P dev
# bindd = $mainMod SHIFT, B, Zen Browser 008, exec, uwsm-app -- flatpak run app.zen_browser.zen -P 008

bindd = $mainMod SHIFT, B, Helium Default, exec, uwsm-app -- helium-browser --profile-directory=Default --ozone-platform=wayland --ozone-platform-hint=wayland
bindd = $mainMod, O, Obsidian, exec, ~/dotfiles/bin/hyprland-launch-special-app "obsidian" "obsidian -disable-gpu --enable-wayland-ime" "note"
bindd = $mainMod, F, Files, exec, uwsm-app -- nautilus --new-window
# bind = $mainMod SHIFT, F, exec, $termianl -e zsh -i -c "fod"
bindd = $mainMod, E, Zed, exec, $terminal -e zsh -i -c "zed"
bindd = $mainMod SHIFT, X, HeliumBrowser, exec, ~/dotfiles/bin/hyprland-launch-special-app "helium" "helium-browser --profile-directory='Profile 2'" "work"

# gui application
# bind = $mainMod, B, exec, flatpak run app.zen_browser.zen -P


# tui applications
bindd = $mainMod SHIFT, T, Bottom, exec, $terminal -e btm
bindd = $mainMod, Q, Network, exec, $terminal -e nmtui
bindd = $mainMod SHIFT, C, Docker, exec, $terminal -e lazydocker

# special tui applications
bindd = $mainMod, Z, Zellij, exec, ~/dotfiles/bin/hyprland-launch-special-app "^zellij$" "ghostty -e zellij attach --create zellij options --on-force-close quit" "zellij"

# special web apps
bindd = $mainMod, A, ChatGPT, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "chatgpt" "https://chatgpt.com" "ai"
bindd = $mainMod, M,Gmail, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "gmail" "https://mail.google.com/mail/u/0" "gmail"
bindd = $mainMod SHIFT, M, Meet, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "meet" "https://meet.google.com" "meet"
bindd = $mainMod SHIFT, D, Drive, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "drive" "https://drive.google.com" "drive"
bindd = $mainMod, Y, YouTube, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "youtube" "https://www.youtube.com" "yt"
bindd = $mainMod, T, Localhost, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "tasks" "https://tasks.google.com/u/1/tasks/" "tasks"

# web apps
bindd = $mainMod ALT, G, Gmail Alt, exec, $webapp="https://mail.google.com/mail/u/1"

# printing/screenshot
bindd = ,PRINT, Screenshot, exec, grim -g "$(slurp -d)" - | tee ~/Pictures/Screenshots/screenshot-$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy
bindd = shift, PRINT, Screenshot Edit, exec, grim -g "$(slurp -d)" - | tee ~/Pictures/Screenshots/screenshot-$(date +'%Y-%m-%d_%H-%M-%S').png | swappy -f -


# hyprpicker
bindd = $mainMod, PRINT, Color Picker, exec, hyprpicker -a # color picker

