# application state
bindd = SUPER, W, Close window, killactive,

# power settings
binddl = SUPER CTRL SHIFT, S, Shutdown, exec, shutdown now
binddl = SUPER CTRL SHIFT, R, Restart, exec, shutdown -r now
binddl = SUPER CTRL, R, reload hyprland, exec, hyprctl reload
binddl = SUPER CTRL, M, Exit hyprland, exit,
binddl = SUPER CTRL, S, Suspend, exec, systemctl suspend
binddl = SUPER CTRL SHIFT, l, Lock, exec, hyprlock

# intenal display
binddl = SUPER CTRL, D, Close display, exec, ~/dotfiles/bin/hyprland-close-display eDP-1
binddl = SUPER CTRL SHIFT, D, Close display, exec, ~/dotfiles/bin/hyprland-close-display HDMI-A-1

# luncher
bindd = SUPER, space, walker, exec, uwsm-app -- walker
bindd = SUPER, P, walker, exec, uwsm-app -- walker
bindd = SUPER SHIFT, P, Scripts, exec, ~/dotfiles/bin/walker/execute-command

# utility gui applications
# bindd = SUPER ALT, 1, MongoDB Compass, exec, flatpak run com.mongodb.Compass --trustedConnectionString $(pass env/mongodb_uri)
# bindd = SUPER ALT, 1, Brave, exec, uwsm-app -- brave --new-window --ozone-platform=wayland
# bindd = SUPER ALT, 2, Perplexity, exec, $webapp="https://www.perplexity.ai"
# bindd = SUPER ALT, 3, Gemini, exec, $webapp="https://gemini.google.com/app"

# gui applications
bind = SUPER, Return, exec, $terminal
bindd = SUPER, B, Zen Browser dev, exec, uwsm-app -- flatpak run app.zen_browser.zen -P dev
bindd = SUPER SHIFT, B, Helium Default, exec, uwsm-app -- helium-browser --profile-directory=Default --ozone-platform=wayland --ozone-platform-hint=wayland
bindd = SUPER, F, yazi, exec, $terminal -e yazi
bindd = SUPER, E, Zed, exec, $terminal -e zsh -i -c "zed_open_dir"

# special gui applications
# bindd = SUPER ALT, B, Zen Browser 008, exec, ~/dotfiles/bin/hyprland-launch-zen "zen008" "uwsm-app -- flatpak run app.zen_browser.zen -P 008"
bindd = SUPER, O, Obsidian, exec, ~/dotfiles/bin/hyprland-launch-special-app "obsidian" "obsidian -disable-gpu --enable-wayland-ime" "note"
bindd = SUPER SHIFT, W, HeliumBrowser, exec, ~/dotfiles/bin/hyprland-launch-special-app "helium" "helium-browser --profile-directory='Profile 2'" "work"
bindd = SUPER, M, Thunderbird, exec, ~/dotfiles/bin/hyprland-launch-special-app "thunderbird" "thunderbird" "thunderbird"

# tui applications
bindd = SUPER SHIFT, T, Bottom, exec, $terminal -e btm
bindd = SUPER, N, Network, exec, $terminal -e nmtui
bindd = SUPER SHIFT, D, Docker, exec, $terminal -e lazydocker
bindd = SUPER, X, todo, exec, $terminal -e todo-app
# bindd = SUPER SHIFT, D, Docker, exec, ~/dotfiles/bin/hyprland-launch-special-app "^lazydocker$" "ghostty -e lazydocker" "lazydocker"

# special tui applications
bindd = SUPER, U, Zellij, exec, ~/dotfiles/bin/hyprland-launch-special-app "zellij" "ghostty -e zellij attach --create zellij options --on-force-close quit" "zellij"
# bindd = SUPER, i, Zellij, exec, ~/dotfiles/bin/hyprland-launch-special-app 'work-zellij' 'ghostty -e zellij -l work attach --create work-zellij options --on-force-close quit' 'work-zellij'
# bindd = SUPER, i, Tmux work session, exec, ~/dotfiles/bin/hyprland-launch-special-app 'work-tmux' 'tmux new -s work' 'work-tmux'
bindd = SUPER, i, Tmux work session, exec, ~/dotfiles/bin/hyprland-launch-special-app 'tmux-work' 'ghostty -e tmux a -d -t tmux-work' 'tmux-work'

# doesn't work, executable not found, not on PATH
# bindd = SUPER SHIFT, R, Timer, exec, ~/dotfiles/bin/hyprland-launch-special-app "gotimer" "ghostty -e go-timer" "gotimer"
# bindd = SUPER SHIFT, R, Timer, exec,  $terminal -e timer

# special web apps
bindd = SUPER, A, ChatGPT, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "chatgpt" "https://chatgpt.com" "ai"
# bindd = SUPER, M, Gmail, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "gmail" "https://mail.google.com/mail/u/0" "gmail"
bindd = SUPER SHIFT, C, Calendar, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "Google Calendar" "https://calendar.google.com/calendar" "calendar"
bindd = SUPER SHIFT, M, Meet, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "meet" "https://meet.google.com" "meet"
bindd = SUPER, Z, Zulip, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "zulip" "https://mamacrm.zulipchat.com" "zulip"
# bindd = SUPER, Y, YouTube, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "youtube" "https://www.youtube.com" "yt"
bindd = SUPER, T, Tasks, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "tasks" "https://tasks.google.com/u/1/tasks/" "tasks"
bindd = SUPER SHIFT, F, Figma, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "figma" "https://www.figma.com" "figma"

# printing/screenshot
bindd = ,PRINT, Screenshot, exec, grim -g "$(slurp -d)" - | tee ~/Pictures/Screenshots/screenshot-$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy
bindd = shift, PRINT, Screenshot Edit, exec, grim -g "$(slurp -d)" - | tee ~/Pictures/Screenshots/screenshot-$(date +'%Y-%m-%d_%H-%M-%S').png | swappy -f -

# hyprpicker
bindd = SUPER, PRINT, Color Picker, exec, hyprpicker -a # color picker
