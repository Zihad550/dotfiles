$mainMod = SUPER # Sets "Windows" key as main modifier

# applicate state
# bind = $mainMod, Q, killactive,
bindd = $mainMod, W, Close window, killactive,

# hyprland
bindd = $mainMod ALT, M, Exit hyprland, exit,

# layout
bindd = $mainMod, V, Toggle floating, togglefloating
bindd = $mainMod ALT, P, Pseudo, pseudo # dwindle
bindd = $mainMod, slash, Toggle split, togglesplit # dwindle

# power settings
bind = $mainMod ALT CTRL, S, exec, shutdown now
bind = $mainMod ALT SHIFT, R, exec, shutdown -r now
bind = $mainMod ALT SHIFT, S, exec, systemctl suspend
bind = $mainMod ALT SHIFT, l, exec, hyprlock

# luncher
bindd = $mainMod, space, rofi, exec, $menu
# bind = $mainMod, space, exec, hyprlauncher
# bind = $mainMod SHIFT, space, exec, rofi -modi "window,ssh" -show combi
bind = $mainMod SHIFT, space, exec, uwsm-app -- rofi -show window
bind = $mainMod SHIFT, E, exec, uwsm-app -- rofi -show emoji
bind = $mainMod SHIFT, C, exec, uwsm-app -- rofi -show calc
bind = $mainMod, P, exec, uwsm-app -- rofi -show manage_processes
bind = $mainMod SHIFT, P, exec, uwsm-app -- rofi -show multi_script

# utility gui applications
bind = $mainMod ALT, 1, exec, uwsm-app -- brave
bind = $mainMod ALT, 2, exec, $webapp="https://www.perplexity.ai"
bind = $mainMod ALT, 3, exec, $webapp="https://gemini.google.com/app"
bind = $mainMod ALT, 4, exec, flatpak run com.mongodb.Compass --trustedConnectionString $(pass env/mongodb_uri)

# custom scripts
# bind = $mainMod ALT, S, exec, bash -c 'if pgrep -f nerd-dictation >/dev/null; then nerd-dictation end; else nerd-dictation begin --simulate-input-tool WTYPE --idle-time 0 >/dev/null 2>&1 & fi'

# special gui applications
bind = $mainMod, Return, exec, $terminal
bindd = $mainMod, B, Zen Browser, exec, ~/dotfiles/bin/hyprland-launch-special-app "Zen Browser" "uwsm-app -- flatpak run app.zen_browser.zen " "browser"
bind = $mainMod SHIFT, B, exec, uwsm-app -- flatpak run app.zen_browser.zen -P
bind = $mainMod ALT, B, exec, uwsm-app -- helium-browser --profile-directory=Default --ozone-platform=wayland --ozone-platform-hint=wayland

bindd = $mainMod, O, Obsidian, exec, ~/dotfiles/bin/hyprland-launch-special-app "obsidian" "obsidian -disable-gpu --enable-wayland-ime" "note"
bind = $mainMod, F, exec, uwsm-app -- nautilus --new-window
# bind = $mainMod SHIFT, F, exec, $termianl -e zsh -i -c "fod"
bind = $mainMod, E, exec, $terminal -e zsh -i -c "zed"
bindd = $mainMod, X, HeliumBrowser, exec, ~/dotfiles/bin/hyprland-launch-special-app "helium" "helium-browser --profile-directory='Profile 2'" "work"

# gui application
# bind = $mainMod, B, exec, flatpak run app.zen_browser.zen -P


# tui applications
bind = $mainMod SHIFT, T, exec, $terminal -e btm
bind = $mainMod, Q, exec, $terminal -e nmtui
bind = $mainMod, C, exec, $terminal -e lazydocker

# special tui applications
bindd = $mainMod, Z, Zellij, exec, ~/dotfiles/bin/hyprland-launch-special-app "^zellij$" "ghostty -e zellij attach --create zellij" "zellij"

# special web apps
bindd = $mainMod, A, ChatGPT, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "chatgpt" "https://chatgpt.com" "ai"
bindd = $mainMod, G,Gmail, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "gmail" "https://mail.google.com/mail/u/0" "gmail"
bindd = $mainMod, M, Meet, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "meet" "https://meet.google.com" "meet"
bindd = $mainMod, D, Drive, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "drive" "https://drive.google.com" "drive"
bindd = $mainMod, Y, YouTube, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "youtube" "https://www.youtube.com" "yt"
bindd = $mainMod, T, Localhost, exec, ~/dotfiles/bin/hyprland-launch-special-webapp "localhost" "https://localhost:5175" "localhost"

# web apps
bind = $mainMod SHIFT, G, exec, $webapp="https://mail.google.com/mail/u/1"

# printing/screenshot
bind = ,PRINT, exec, grim -g "$(slurp -d)" - | tee ~/Pictures/Screenshots/screenshot-$(date +'%Y-%m-%d_%H-%M-%S').png | wl-copy
bind = shift, PRINT, exec, grim -g "$(slurp -d)" - | tee ~/Pictures/Screenshots/screenshot-$(date +'%Y-%m-%d_%H-%M-%S').png | swappy -f -


# hyprpicker
bind = $mainMod, PRINT, exec, hyprpicker -a # color picker

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d
# move window
bind = $mainMod SHIFT, h, movewindow, l
bind = $mainMod SHIFT, l, movewindow, r
bind = $mainMod SHIFT, k, movewindow, u
bind = $mainMod SHIFT, j, movewindow, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# special workspaces (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# bind = $mainMod, X, togglespecialworkspace, work
# bind = $mainMod SHIFT, X, movetoworkspace, special:work

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/eesize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# resize mode
bind = $mainMod, R, submap, resize

submap = resize
binde=,l,resizeactive,10 0
binde=,h,resizeactive,-10 0
binde=,mouse_up,resizeactive,10 0
binde=,mouse_down,resizeactive,-10 0
binde=,k,resizeactive,0 -10
binde=,j,resizeactive,0 10
bind=,escape,submap,reset
submap=reset

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-


# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# control tiling
bindd = SHIFT, F11, Force full screen, fullscreen, 0
bindd = ALT, F11, Full width, fullscreen, 1
