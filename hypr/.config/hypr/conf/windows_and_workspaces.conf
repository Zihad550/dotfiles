# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# Hyprland 0.53+ syntax
windowrule = suppress_event maximize, match:class .*

# Just dash of opacity by default
# windowrule = opacity 0.97 0.9, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# scrolling layout on workspace 4-8
workspace = 1, layout:scrolling
workspace = 3, layout:scrolling
workspace = 4, layout:scrolling
workspace = 5, layout:scrolling
workspace = 6, layout:scrolling
workspace = 7, layout:scrolling
workspace = 8, layout:scrolling
workspace = 9, layout:scrolling
