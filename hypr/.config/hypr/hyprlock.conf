# LAYOUT
label {
  monitor =
  text = Layout: $LAYOUT
  color = $font_color
  font_size = 25
  font_family = $font
  position = 30, -30
  halign = left
  valign = top
}

# TIME
label {
  monitor =
  text = $TIME
  color = $font_color
  font_size = 90
  font_family = $font
  position = -30, 0
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $font_color
  font_size = 25
  font_family = $font
  position = -30, -150
  halign = right
  valign = top
}

