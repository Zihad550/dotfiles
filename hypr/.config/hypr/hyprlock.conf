source = $HOME/.config/theme/hyprlock.conf

$red = rgb(ff5555)
$yellow = rgb(f1fa8c)
$font = JetBrainsMono Nerd Font

# GENERAL
general {
    ignore_empty_input = true
    hide_cursor = true
}

background {
  monitor =
  blur_passes = 3
  color = $color
}

# image {
#   monitor =
#   path = $HOME/.config/backgrounds/cat-on-line.png
#   halign = center
#   valign = center
#   rounding = 0 # no rounding
#   border_size = 0
# }

# LAYOUT
label {
  monitor =
  text = Layout: $LAYOUT
  color = $font_color
  font_size = 25
  font_family = $font
  position = 30, -30
  halign = left
  valign = top
}

# TIME
label {
  monitor =
  text = $TIME
  color = $font_color
  font_size = 90
  font_family = $font
  position = -30, 0
  halign = right
  valign = top
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $font_color
  font_size = 25
  font_family = $font
  position = -30, -150
  halign = right
  valign = top
}

# FINGERPRINT
{
  monitor = "";
  text = "$FPRINTPROMPT";
  color = "$font_color";
  font_size = 14;
  font_family = $font;
  position = "0, -107";
  halign = "center";
  valign = "center";
}

# USER AVATAR
image {
  monitor =
  path = $HOME/.face/profile.png
  size = 100
  border_color = $outer_color
  position = 0, 75
  halign = center
  valign = center
}

# INPUT FIELD
input-field {
  monitor =
  size = 300, 60
  outline_thickness = 4
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $outer_color
  inner_color = $inner_color
  font_color = $font_color
  fade_on_empty = false
  placeholder_text = Enter Password
  hide_input = false
  check_color = $check_color
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -37
  halign = center
  valign = center
}
