# Elephant main config. Keys come from ElephantConfig in pkg/common/config.go
# (koanf tags); `elephant generatedoc` prints the full set.

# Checked by internal/providers/load.go before each plugin is dlopen'd, so an
# ignored provider is never loaded and never indexes anything.
#
# files: its open action is hardcoded to `xdg-open %s`, with ignored_dirs as the
# only knob -- there is no way to make it open a hit in Zed. That is why "/" kept
# landing in the file manager. It also walks the filesystem to build its index
# and is why `fd` is a dependency.
#
# NOTE: this does NOT free the "/" prefix on its own. Walker ships "/" -> files
# in its own defaults (resources/config.toml) and merges user config by matching
# on provider, so a default prefix can never be deleted -- only retargeted. The
# `prefix = ","` block in walker/.config/walker/config.toml is what actually
# moves files off "/". Keep it even though the provider is ignored here; drop it
# and "/" reverts to the built-in files provider.
ignored_providers = ["files"]
