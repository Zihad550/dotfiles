name = "display"
name_pretty = "Display"
icon = "video-display"

[[entries]]
text = "HDMI-A-1: Toggle orientation"
keywords = ["rotate", "orientation", "toggle", "hdmi", "monitor"]
icon = "object-rotate-right"
actions = {"rotate_toggle" = "~/dotfiles/bin/df-hypr-display-rotate toggle"}

[[entries]]
text = "HDMI-A-1: Horizontal"
keywords = ["horizontal", "landscape", "hdmi", "monitor"]
icon = "video-display"
actions = {"rotate_horizontal" = "~/dotfiles/bin/df-hypr-display-rotate horizontal"}

[[entries]]
text = "HDMI-A-1: Vertical"
keywords = ["vertical", "portrait", "hdmi", "monitor"]
icon = "video-display"
actions = {"rotate_vertical" = "~/dotfiles/bin/df-hypr-display-rotate vertical"}

[[entries]]
text = "Layout: Restore saved"
keywords = ["layout", "restore", "apply", "saved", "monitor", "displays"]
icon = "video-display"
actions = {"layout_apply" = "~/dotfiles/bin/df-hypr-display-layout apply"}
