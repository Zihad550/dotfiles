git:
  overrideGpg: true
gui:
  # screenMode: half
  # useHunkModeInStagingView: true # stage one line at a time
  expandFocusedSidePanel: true
  # splitDiff: "auto"
  # Use the mocha catppuccin theme
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
