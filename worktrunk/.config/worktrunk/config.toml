skip-commit-generation-prompt = true

# blocking, complete before post start
[pre-start]
copy = 'wt step copy-ignored'

[post-start]
mise-trust = '[ -f mise.toml ] && mise trust'

[post-switch]
tmux = "[ -n \"$TMUX\" ] && tmux rename-window {{ (repo ~ '-' ~ branch) | sanitize}}"
# mise-install = '[ -f mise.toml ] && mise install'

[commit]
stage = "none"

[commit.generation]
command = "aichat -m gemini:gemini-2.5-flash"
# command = "opencode run -m google/gemini-3-flash-preview"

# template = """
# Write a commit message for this diff. Follow these 3 steps:

# STEP 1 — HEADER (required): One line, under 50 chars,
# Format: <type>[scope][!]: <description>
# - type: `feat` (new feature), `fix` (bug), or any noun (`docs`, `chore`, `refactor`...)
# - scope: optional noun in parentheses → `feat(auth):`
# - `!`: add before `:` if breaking change → `feat(api)!:`
# - description: short summary after the colon+space

# STEP 2 — BODY (optional):
# - Blank line after header, then explain WHY the change was made.
# - Free-form paragraphs, skip if header is self-explanatory.

# STEP 3 — FOOTER (optional):
# - Blank line after body, then add metadata tokens.
# - Format: `Token: value` (use `-` for spaces in token names)
# - Breaking change not marked with `!`: add `BREAKING CHANGE: <what breaks + migration>`

# Output plain text only — no code blocks, no backticks, no markdown.

# Branch: {{ branch }}
# Diff:
# {{ git_diff }}
# """

# squash-template = """
# Combine these {{ commits | length }} commits into one squashed commit message. Follow these 3 steps:

# STEP 1 — HEADER (required): One line, under 50 chars
# Format: <type>[scope][!]: <description>
# - type: `feat` (new feature), `fix` (bug), or any noun (`docs`, `chore`, `refactor`...)
# - scope: optional noun in parentheses → `feat(auth):`
# - `!`: add before `:` if breaking change → `feat(api)!:`
# - description: single summary capturing the overall change across all commits

# STEP 2 — BODY (optional):
# - Blank line after header, then explain the combined intent of the commits.
# - If useful, briefly list the key changes as short bullet points.
# - Skip if the header is self-explanatory.

# STEP 3 — FOOTER (optional):
# - Blank line after body, then add metadata tokens.
# - Format: `Token: value` (use `-` for spaces in token names)
# - If any commit introduced a breaking change: add `BREAKING CHANGE: <what breaks + migration>`

# Output plain text only — no code blocks, no backticks, no markdown.

# Commits:
# {% for c in commits %}
# - {{ c }}
# {% endfor %}

# Diff:
# {{ git_diff }}
# """

[list]
summary = true

# Worktrunk Project Configuration
# Copy to: <repo>/.config/wt.toml
#
# Project-specific hooks that run automatically during worktree operations.
# Check this file into git to share hooks across all developers.

# ============================================================================
# Hook Formats
# ============================================================================
# All hooks support two formats:
#
# Single command:
#   post-create = "npm install"
#
# Named table (multiple commands):
#   [post-create]
#   deps = "npm install"
#   build = "npm run build"
#
# Named commands appear in output, making it easier to identify failures.

# ============================================================================
# Template Variables — see https://worktrunk.dev/hook/#template-variables
# ============================================================================
# Common variables:
#   {{ repo }}               - Repository directory name (e.g., "myproject")
#   {{ branch }}             - Branch name (e.g., "feature/auth")
#   {{ worktree_path }}      - Absolute path to worktree
#   {{ primary_worktree_path }} - Main worktree (or default branch worktree for bare repos)
#   {{ default_branch }}     - Default branch name (e.g., "main")
#   {{ target }}             - Target branch (merge hooks only)
#
# Filters:
#   {{ branch | sanitize }}     - Replace / and \ with - (e.g., "feature-auth")
#   {{ branch | sanitize_db }}  - Database-safe identifier with hash suffix (e.g., "feature_auth_x7k")
#   {{ branch | hash_port }}    - Deterministic port 10000-19999

# ============================================================================
# Hooks
# ============================================================================

# Post-Create: Runs after worktree creation, BLOCKS until complete
# Use for: installing dependencies, setting up databases, copying configs
#
# [post-create]
# deps = "npm ci"
# env = "cp .env.example .env"

# Post-Start: Runs in BACKGROUND after worktree creation (parallel)
# Use for: dev servers, file watchers, background builds
# Output logged to .git/wt-logs/{branch}-project-post-start-{name}.log
#
# [post-start]
# server = "npm run dev -- --port {{ branch | hash_port }}"
# watch = "npm run watch"

# Post-Switch: Runs in BACKGROUND after every switch (parallel)
# Use for: terminal tab naming, tmux window titles, IDE notifications
#
# post-switch = "echo -ne '\\033]0;{{ branch }}\\007'"

# Pre-Commit: Runs before committing during merge, BLOCKS (fail-fast)
# Use for: formatters, linters, quick checks
#
# [pre-commit]
# format = "npm run format:check"
# lint = "npm run lint"

# Pre-Merge: Runs before merging to target, BLOCKS (fail-fast)
# Use for: tests, build verification
#
# [pre-merge]
# test = "npm test"
# build = "npm run build"

# Post-Merge: Runs after successful merge, BLOCKS
# Use for: deployment, notifications
#
# post-merge = "echo 'Merged {{ branch }} to {{ target }}'"

# Pre-Remove: Runs before worktree removal, BLOCKS (fail-fast)
# Use for: cleanup, stopping services
#
# pre-remove = "docker compose down"

# ============================================================================
# Aliases (experimental) — run with `wt step <name>`
# ============================================================================
# Command templates that support the same variables as hooks.
# Project-config aliases require command approval on first run.
#
# [aliases]
# deploy = "make deploy BRANCH={{ branch }}"
# url = "echo http://localhost:{{ branch | hash_port }}"

# ============================================================================
# Dev Server URL (shown in `wt list`)
# ============================================================================
# [list]
# url = "http://localhost:{{ branch | hash_port }}"

# ============================================================================
# CI Platform Override
# ============================================================================
# Override CI platform detection for GitHub Enterprise or self-hosted GitLab
# with custom domains where URL detection fails.
#
# [ci]
# platform = "github"  # or "gitlab"
