# Tmux theme (auto-generated from template)
# Colors sourced from current theme's colors.toml

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#475258,bg=#7fbbb3,bold] #S #[bg=default] "
set -g status-right "#[fg=#7fbbb3]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#475258]#h "
set -g window-status-format "#[fg=#475258] #I:#W "
set -g window-status-current-format "#[fg=#7fbbb3,bold] #I:#W "
set -g pane-border-style "fg=#475258"
set -g pane-active-border-style "fg=#7fbbb3"
set -g message-style "bg=default,fg=#7fbbb3"
set -g message-command-style "bg=default,fg=#7fbbb3"
set -g mode-style "bg=#7fbbb3,fg=#475258"
