# Tmux theme (auto-generated from template)
# Colors sourced from current theme's colors.toml

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#ffffff,bg=#6e6e6e,bold] #S #[bg=default] "
set -g status-right "#[fg=#6e6e6e]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#c0c0c0]#h "
set -g window-status-format "#[fg=#c0c0c0] #I:#W "
set -g window-status-current-format "#[fg=#6e6e6e,bold] #I:#W "
set -g pane-border-style "fg=#c0c0c0"
set -g pane-active-border-style "fg=#6e6e6e"
set -g message-style "bg=default,fg=#6e6e6e"
set -g message-command-style "bg=default,fg=#6e6e6e"
set -g mode-style "bg=#6e6e6e,fg=#ffffff"
