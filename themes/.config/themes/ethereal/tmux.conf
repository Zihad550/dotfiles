# Tmux theme (auto-generated from template)
# Colors sourced from current theme's colors.toml

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#060B1E,bg=#7d82d9,bold] #S #[bg=default] "
set -g status-right "#[fg=#7d82d9]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#6d7db6]#h "
set -g window-status-format "#[fg=#6d7db6] #I:#W "
set -g window-status-current-format "#[fg=#7d82d9,bold] #I:#W "
set -g pane-border-style "fg=#6d7db6"
set -g pane-active-border-style "fg=#7d82d9"
set -g message-style "bg=default,fg=#7d82d9"
set -g message-command-style "bg=default,fg=#7d82d9"
set -g mode-style "bg=#7d82d9,fg=#060B1E"
