# Tmux theme (auto-generated from template)
# Colors sourced from current theme's colors.toml

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#bcc0cc,bg=#1e66f5,bold] #S #[bg=default] "
set -g status-right "#[fg=#1e66f5]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#acb0be]#h "
set -g window-status-format "#[fg=#acb0be] #I:#W "
set -g window-status-current-format "#[fg=#1e66f5,bold] #I:#W "
set -g pane-border-style "fg=#acb0be"
set -g pane-active-border-style "fg=#1e66f5"
set -g message-style "bg=default,fg=#1e66f5"
set -g message-command-style "bg=default,fg=#1e66f5"
set -g mode-style "bg=#1e66f5,fg=#bcc0cc"
