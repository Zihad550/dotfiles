# Tmux theme (auto-generated from template)
# Colors sourced from current theme's colors.toml

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#72696a,bg=#f38d70,bold] #S #[bg=default] "
set -g status-right "#[fg=#f38d70]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#948a8b]#h "
set -g window-status-format "#[fg=#948a8b] #I:#W "
set -g window-status-current-format "#[fg=#f38d70,bold] #I:#W "
set -g pane-border-style "fg=#948a8b"
set -g pane-active-border-style "fg=#f38d70"
set -g message-style "bg=default,fg=#f38d70"
set -g message-command-style "bg=default,fg=#f38d70"
set -g mode-style "bg=#f38d70,fg=#72696a"
