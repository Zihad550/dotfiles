# Tmux theme (auto-generated from template)
# Colors sourced from current theme's colors.toml

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#f2e9e1,bg=#56949f,bold] #S #[bg=default] "
set -g status-right "#[fg=#56949f]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#9893a5]#h "
set -g window-status-format "#[fg=#9893a5] #I:#W "
set -g window-status-current-format "#[fg=#56949f,bold] #I:#W "
set -g pane-border-style "fg=#9893a5"
set -g pane-active-border-style "fg=#56949f"
set -g message-style "bg=default,fg=#56949f"
set -g message-command-style "bg=default,fg=#56949f"
set -g mode-style "bg=#56949f,fg=#f2e9e1"
