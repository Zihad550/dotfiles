# Tmux theme (auto-generated from template)
# Colors sourced from current theme's colors.toml

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#000000,bg=#78824b,bold] #S #[bg=default] "
set -g status-right "#[fg=#78824b]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#666666]#h "
set -g window-status-format "#[fg=#666666] #I:#W "
set -g window-status-current-format "#[fg=#78824b,bold] #I:#W "
set -g pane-border-style "fg=#666666"
set -g pane-active-border-style "fg=#78824b"
set -g message-style "bg=default,fg=#78824b"
set -g message-command-style "bg=default,fg=#78824b"
set -g mode-style "bg=#78824b,fg=#000000"
