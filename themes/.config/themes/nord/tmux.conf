# Tmux theme (auto-generated from template)
# Colors sourced from current theme's colors.toml

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#3b4252,bg=#81a1c1,bold] #S #[bg=default] "
set -g status-right "#[fg=#81a1c1]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#4c566a]#h "
set -g window-status-format "#[fg=#4c566a] #I:#W "
set -g window-status-current-format "#[fg=#81a1c1,bold] #I:#W "
set -g pane-border-style "fg=#4c566a"
set -g pane-active-border-style "fg=#81a1c1"
set -g message-style "bg=default,fg=#81a1c1"
set -g message-command-style "bg=default,fg=#81a1c1"
set -g mode-style "bg=#81a1c1,fg=#3b4252"
