# Tmux theme (auto-generated from template)
# Colors sourced from current theme's colors.toml

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#333333,bg=#e68e0d,bold] #S #[bg=default] "
set -g status-right "#[fg=#e68e0d]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#8a8a8d]#h "
set -g window-status-format "#[fg=#8a8a8d] #I:#W "
set -g window-status-current-format "#[fg=#e68e0d,bold] #I:#W "
set -g pane-border-style "fg=#8a8a8d"
set -g pane-active-border-style "fg=#e68e0d"
set -g message-style "bg=default,fg=#e68e0d"
set -g message-command-style "bg=default,fg=#e68e0d"
set -g mode-style "bg=#e68e0d,fg=#333333"
