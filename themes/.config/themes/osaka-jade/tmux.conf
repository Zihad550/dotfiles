# Tmux theme (auto-generated from template)
# Colors sourced from current theme's colors.toml

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#23372B,bg=#509475,bold] #S #[bg=default] "
set -g status-right "#[fg=#509475]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#53685B]#h "
set -g window-status-format "#[fg=#53685B] #I:#W "
set -g window-status-current-format "#[fg=#509475,bold] #I:#W "
set -g pane-border-style "fg=#53685B"
set -g pane-active-border-style "fg=#509475"
set -g message-style "bg=default,fg=#509475"
set -g message-command-style "bg=default,fg=#509475"
set -g mode-style "bg=#509475,fg=#23372B"
