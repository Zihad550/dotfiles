# Tmux theme (auto-generated from template)
# Colors sourced from current theme's colors.toml

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#100F0F,bg=#205EA6,bold] #S #[bg=default] "
set -g status-right "#[fg=#205EA6]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#100F0F]#h "
set -g window-status-format "#[fg=#100F0F] #I:#W "
set -g window-status-current-format "#[fg=#205EA6,bold] #I:#W "
set -g pane-border-style "fg=#100F0F"
set -g pane-active-border-style "fg=#205EA6"
set -g message-style "bg=default,fg=#205EA6"
set -g message-command-style "bg=default,fg=#205EA6"
set -g mode-style "bg=#205EA6,fg=#100F0F"
