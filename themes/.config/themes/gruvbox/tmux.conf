# Tmux theme (auto-generated from template)
# Colors sourced from current theme's colors.toml

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#3c3836,bg=#d65d0e,bold] #S #[bg=default] "
set -g status-right "#[fg=#d65d0e]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#928374]#h "
set -g window-status-format "#[fg=#928374] #I:#W "
set -g window-status-current-format "#[fg=#d65d0e,bold] #I:#W "
set -g pane-border-style "fg=#928374"
set -g pane-active-border-style "fg=#d65d0e"
set -g message-style "bg=default,fg=#d65d0e"
set -g message-command-style "bg=default,fg=#d65d0e"
set -g mode-style "bg=#d65d0e,fg=#3c3836"
