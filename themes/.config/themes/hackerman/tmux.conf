# Tmux theme (auto-generated from template)
# Colors sourced from current theme's colors.toml

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#0B0C16,bg=#82FB9C,bold] #S #[bg=default] "
set -g status-right "#[fg=#82FB9C]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#6a6e95]#h "
set -g window-status-format "#[fg=#6a6e95] #I:#W "
set -g window-status-current-format "#[fg=#82FB9C,bold] #I:#W "
set -g pane-border-style "fg=#6a6e95"
set -g pane-active-border-style "fg=#82FB9C"
set -g message-style "bg=default,fg=#82FB9C"
set -g message-command-style "bg=default,fg=#82FB9C"
set -g mode-style "bg=#82FB9C,fg=#0B0C16"
