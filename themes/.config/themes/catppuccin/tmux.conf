# Tmux theme (auto-generated from template)
# Colors sourced from current theme's colors.toml

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#45475a,bg=#89b4fa,bold] #S #[bg=default] "
set -g status-right "#[fg=#89b4fa]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#585b70]#h "
set -g window-status-format "#[fg=#585b70] #I:#W "
set -g window-status-current-format "#[fg=#89b4fa,bold] #I:#W "
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=default,fg=#89b4fa"
set -g message-command-style "bg=default,fg=#89b4fa"
set -g mode-style "bg=#89b4fa,fg=#45475a"
setw -g clock-mode-colour #89b4fa
