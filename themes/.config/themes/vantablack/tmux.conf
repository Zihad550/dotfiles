# Tmux theme (auto-generated from template)
# Colors sourced from current theme's colors.toml

set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=#0d0d0d,bg=#8d8d8d,bold] #S #[bg=default] "
set -g status-right "#[fg=#8d8d8d]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#fdfdfd]#h "
set -g window-status-format "#[fg=#fdfdfd] #I:#W "
set -g window-status-current-format "#[fg=#8d8d8d,bold] #I:#W "
set -g pane-border-style "fg=#fdfdfd"
set -g pane-active-border-style "fg=#8d8d8d"
set -g message-style "bg=default,fg=#8d8d8d"
set -g message-command-style "bg=default,fg=#8d8d8d"
set -g mode-style "bg=#8d8d8d,fg=#0d0d0d"
