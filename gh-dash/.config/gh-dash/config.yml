prSections:
  - title: My Pull Requests
    filters: is:open author:@me
  - title: Needs My Review
    filters: is:open review-requested:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
issuesSections:
  # - title: My Issues
  #   filters: is:open author:@me
  - title: All open Issues
    filters: is:open
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me -author:@me
notificationsSections:
  - title: All
    filters: ""
  - title: Created
    filters: reason:author
  - title: Participating
    filters: reason:participating
  - title: Mentioned
    filters: reason:mention
  - title: Review Requested
    filters: reason:review-requested
  - title: Assigned
    filters: reason:assign
  - title: Subscribed
    filters: reason:subscribed
  - title: Team Mentioned
    filters: reason:team-mention
repo:
  branchesRefetchIntervalSeconds: 30
  prsRefetchIntervalSeconds: 60
defaults:
  preview:
    open: true # there is a issue that doesn't allow it to be false
    width: 0.70
    position: right
  prsLimit: 20
  prApproveComment: LGTM
  issuesLimit: 20
  notificationsLimit: 20
  view: issues
  layout:
    prs:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 20
      author:
        width: 15
      authorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 15
    issues:
      updatedAt:
        width: 5
      createdAt:
        width: 5
      repo:
        width: 15
      creator:
        width: 10
      creatorIcon:
        hidden: false
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
    universal:
      - key: ctrl+g
        name: lazygit
        command: >
          cd {{.RepoPath}} && lazygit
      - key: C
        name: code review
        command: >
          tmux new-window -n "PR-{{.PrNumber}}"
          'wt switch pr:{{.PrNumber}} -x "opencode --prompt review-pr-for-this-branch"'
    issues:
      - key: n
        name: Create issue
        command: gh issue create --repo {{.RepoName}}
      # - key: C
      #   name: code review
      #   command: >
      #     tmux new-window -n "PR-{{.PrNumber}}"
      #     opencode pr {{.PrNumber}}
      # - key: C
      #   name: code review
      #   command: >
      #     tmux new-window -n {{.RepoName}}
      #     'nvim -c
      #     ":silent Octo pr edit {{.PrNumber}}}"'
repoPaths:
theme:
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
      compact: false
pager:
  diff: "diffnav"
confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
includeReadNotifications: true
