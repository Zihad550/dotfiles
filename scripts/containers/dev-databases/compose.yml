name: dotfiles-dev-db

services:
  postgres:
    profiles: [postgres]
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dev
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dev -d dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  mysql:
    profiles: [mysql]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: dev
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: dev
    ports: ["127.0.0.1:${MYSQL_PORT:-3306}:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 3s
      retries: 30

  mariadb:
    profiles: [mariadb]
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_USER: dev
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_DATABASE: dev
    ports: ["127.0.0.1:${MARIADB_PORT:-3307}:3306"]
    volumes: [mariadb-data:/var/lib/mysql]
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    profiles: [redis]
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD}"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: [CMD-SHELL, "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo:
    profiles: [mongo]
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports: ["127.0.0.1:${MONGO_PORT:-27017}:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: [CMD-SHELL, "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' --username dev --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin"]
      interval: 5s
      timeout: 5s
      retries: 30

  mssql:
    profiles: [mssql]
    image: mcr.microsoft.com/mssql/server:2022-CU12-ubuntu-22.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD}
    ports: ["127.0.0.1:${MSSQL_PORT:-1433}:1433"]
    volumes: [mssql-data:/var/opt/mssql]
    healthcheck:
      test: [CMD-SHELL, "/opt/mssql-tools/bin/sqlcmd -C -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  postgres-data:
  mysql-data:
  mariadb-data:
  redis-data:
  mongo-data:
  mssql-data:
