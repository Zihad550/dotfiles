# hypridle config for arch-devbox.
#
# The shared hypr/.config/hypr/hypridle.conf is arch-hyprland's, and the laptop
# genuinely wants its suspend listener — so this box points hypridle at this
# file instead, via a systemd user drop-in written by ./setup-no-sleep (or, if
# you want idle behavior only and manual suspend left working,
# ./setup-hypridle-no-suspend on its own):
#
#   ~/.config/systemd/user/hypridle.service.d/override.conf
#     ExecStart=
#     ExecStart=/usr/bin/hypridle -c <this file>
#
# It is a whole separate file rather than an override because hypridle listeners
# are additive — a sourced config can add a listener, never subtract one.
#
# Differences from the shared config:
#   - NO suspend listener. That is the entire point; a devbox that suspends is
#     a devbox you cannot ssh into.
#   - No screen-dim or keyboard-backlight listeners. `brightnessctl -sd
#     rgb:kbd_backlight` errors on hardware without a keyboard backlight, and
#     dimming a monitor that is usually detached is pointless.
#   - Screen lock and DPMS-off are kept. Neither affects ssh, and locking an
#     unattended machine is worth having.

general {
    lock_cmd = qs -c lock ipc call lock lock    # ask the running Session Lock.

    # Inert while ./setup-no-sleep has sleep.target masked — nothing here ever
    # suspends. Kept so the file still behaves correctly if you unmask it.
    before_sleep_cmd = qs -c lock ipc call lock lock # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # avoid having to press a key twice.
}

# lock screen
listener {
    timeout = 1800                              # 30min
    on-timeout = qs -c lock ipc call lock lock
}

# screen off — display only, the machine stays up and reachable
listener {
    timeout = 1830                              # 30.5min
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Deliberately no suspend listener. The shared config has:
#     listener {
#         timeout = 1860
#         on-timeout = systemctl suspend
#     }
# Adding it back here would still be blocked by the masked sleep.target, but do
# not rely on that as the only guard — leave it out.
