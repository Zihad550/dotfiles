engine = "parakeet"
state_file = "auto"

[hotkey]
enabled = false

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60
pause_media = false

[whisper]
model = "small.en"
language = "en"
translate = false

[output]
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 1

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = false

[parakeet]
model = "parakeet-tdt-0.6b-v2"
on_demand_loading = false
streaming = false

[text]
spoken_punctuation = true
smart_auto_submit = false
